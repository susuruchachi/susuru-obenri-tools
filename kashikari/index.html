<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>貸し借り帳</title>
<meta name="description" content="きょうだい・家族のお金の貸し借りを、みんなの端末で見られる帳簿。書けるのは貸した本人だけ。" />

<!-- PWA：アプリとしてインストールするための設定 -->
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#131E29" />
<link rel="icon" href="./icons/icon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="./icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="貸し借り帳" />

<link rel="stylesheet" href="./style.css" />
<!-- ログインとデータ（Firebase：すするanki・航海日誌と同じプロジェクト） -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="shell">
  <div id="apk" class="apk-banner" hidden>
    <p class="grow"><b>📲 新しいアプリがあります</b><br>今回だけ確認が出ます。次からは、アプリを閉じたときに自動で更新されます（記録はそのまま）。</p>
    <button type="button">更新する</button>
  </div>

  <div class="ship">
    <header class="head">
      <svg class="compass-mark" width="150" height="150" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="none" stroke="#C9A15C" stroke-width="1" />
        <circle cx="50" cy="50" r="37" fill="none" stroke="#C9A15C" stroke-width="0.5" />
        <line x1="50" y1="4" x2="50" y2="96" stroke="#C9A15C" stroke-width="0.5" />
        <line x1="4" y1="50" x2="96" y2="50" stroke="#C9A15C" stroke-width="0.5" />
        <polygon points="50,10 56,50 50,90 44,50" fill="#C9A15C" />
      </svg>
      <div class="head-row">
        <div class="brand">
          <!-- 真鍮の硬貨（縁に目盛り・まん中に錨の輪） -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9.5" />
            <circle cx="12" cy="12" r="6.5" stroke-width="1" stroke-dasharray="1.2 2" />
            <circle cx="12" cy="8.6" r="1.4" />
            <path d="M12 10v6.5M9.2 12.2h5.6M8.6 14.6c.8 1.4 2 2 3.4 2s2.6-.6 3.4-2" />
          </svg>
          <h1>貸し借り帳</h1>
        </div>
        <button id="syncBtn" class="chipbtn" type="button" aria-label="ログインと同期">☁️ …</button>
      </div>
      <div id="tabs" class="tabs" role="tablist" hidden></div>
    </header>
    <main id="main"><section class="sec"><p class="empty">読み込み中…</p></section></main>
  </div>

  <p class="foot">貸した記録を書けるのは、貸した本人だけ。<br>借りた人は「返したよ」で知らせて、貸した人が認めると返済に入ります。</p>
</div>
<div id="sheet"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- 読み込み順が依存関係：store → ledger → app-bridge → app -->
<script src="./store.js"></script>
<script src="./ledger.js"></script>
<script src="./app-bridge.js"></script>
<script src="./app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  }
</script>
</body>
</html>
