<title>きょうだい貸し借り帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@700;900&display=swap">
<style>
/* Layout: one passbook-style column. Summary "残高" up top, then entries like lines in a bankbook. */
:root {
  --paper: #edf1ea;
  --sheet: #fbfcf8;
  --ink: #1c2830;
  --muted: #5b6a64;
  --line: #d2dbd1;
  --ai: #2b4a7a;
  --ai-soft: #e1e8f3;
  --on-ai: #ffffff;
  --shu: #c23e2b;
  --ok: #2c7650;
  --ok-soft: #dfefe5;
  --warn: #9a5f0c;
  --warn-soft: #f6ead3;
  --due: #b2392a;
  --due-soft: #f7e1dc;
  --shadow: 0 1px 0 rgba(28, 40, 48, .06), 0 8px 24px -12px rgba(28, 40, 48, .18);
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  --font-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12181a; --sheet: #1a2225; --ink: #e5ebe6; --muted: #9ba9a2; --line: #2e393b;
    --ai: #93b2e8; --ai-soft: #223150; --on-ai: #0f1a2c; --shu: #e8664f;
    --ok: #74c99c; --ok-soft: #1c3427; --warn: #e3ab52; --warn-soft: #3a2d15; --due: #ef8a78; --due-soft: #3d221d;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12181a; --sheet: #1a2225; --ink: #e5ebe6; --muted: #9ba9a2; --line: #2e393b;
  --ai: #93b2e8; --ai-soft: #223150; --on-ai: #0f1a2c; --shu: #e8664f;
  --ok: #74c99c; --ok-soft: #1c3427; --warn: #e3ab52; --warn-soft: #3a2d15; --due: #ef8a78; --due-soft: #3d221d;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
body.locked { overflow: hidden; }
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
#app { display: grid; gap: 16px; min-width: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.6rem, 5vw, 2.1rem); letter-spacing: .04em; line-height: 1.2; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }
.me { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }
.me img { width: 28px; height: 28px; border-radius: 50%; }
.me b { color: var(--ink); }

/* controls */
.btn {
  border: 1px solid var(--line); background: var(--sheet); border-radius: 8px;
  padding: 8px 14px; cursor: pointer; line-height: 1.3; white-space: nowrap;
}
.btn:hover { border-color: var(--ai); }
.btn.primary { background: var(--ai); color: var(--on-ai); border-color: var(--ai); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--due); border-color: color-mix(in srgb, var(--due) 45%, var(--line)); }
.btn.small { padding: 4px 10px; font-size: .85rem; border-radius: 6px; }
.btn.link { border: 0; background: none; padding: 0; color: var(--ai); text-decoration: underline; text-underline-offset: 3px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.tabs { display: inline-flex; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; background: none; padding: 7px 16px; border-radius: 7px; cursor: pointer; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--ai-soft); color: var(--ink); font-weight: 700; }

/* notices */
.notice { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.notice.join { border: 1.5px dashed var(--ai); display: grid; gap: 10px; }
.notice h2 { font-size: 1.05rem; }
.notice p { margin: 0; color: var(--muted); font-size: .9rem; }
.inline-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.inline-form input { flex: 1 1 160px; min-width: 0; }

input[type="text"], input[type="date"], textarea {
  background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%;
}
textarea { resize: vertical; min-height: 64px; }
input:focus, textarea:focus { border-color: var(--ai); outline: none; box-shadow: 0 0 0 3px var(--ai-soft); }

/* summary */
.ledger { background: var(--sheet); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.ledger-head { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); border-bottom: 1px solid var(--line); }
.balance { padding: 18px 20px; display: grid; gap: 2px; }
.balance + .balance { border-left: 1px solid var(--line); }
.balance .label { font-size: .8rem; color: var(--muted); letter-spacing: .06em; }
.balance .num { font-size: 1.7rem; font-weight: 600; }
.balance.in .num { color: var(--ok); }
.balance.out .num { color: var(--due); }
.balance .hint { font-size: .78rem; color: var(--muted); }
@media (max-width: 420px) { .balance + .balance { border-left: 0; border-top: 1px solid var(--line); } }

.section-title { font-size: .8rem; letter-spacing: .12em; color: var(--muted); padding: 14px 20px 6px; font-weight: 700; }
.rows { list-style: none; margin: 0; padding: 0 0 8px; }
.rows li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 10px 20px; border-top: 1px dashed var(--line); }
.rows li:first-child { border-top: 0; }
.rows .who { min-width: 0; }
.rows .who small { display: block; color: var(--muted); font-size: .8rem; }
.rows .amt { font-size: 1.1rem; font-weight: 600; text-align: right; }
.rows .amt.in { color: var(--ok); }
.rows .amt.out { color: var(--due); }
.rows .amt.zero { color: var(--muted); font-weight: 500; font-size: .95rem; font-family: var(--font-body); }
.arrow { color: var(--muted); padding: 0 .25em; }
.empty { padding: 14px 20px 18px; color: var(--muted); font-size: .9rem; }

/* entries */
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: .88rem; }
.chip[aria-pressed="true"] { background: var(--ai); border-color: var(--ai); color: var(--on-ai); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: .88rem; color: var(--muted); cursor: pointer; }

.entries { display: grid; gap: 14px; }
.entry { position: relative; background: var(--sheet); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px 14px; display: grid; gap: 10px; overflow: hidden; }
.entry.done { opacity: .9; }
.entry-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; align-items: baseline; padding-right: 64px; }
.entry-head h3 { font-size: 1.1rem; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.entry-head time { font-size: .85rem; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .85rem; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 500; }
.memo { font-size: .88rem; color: var(--muted); margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

.shares { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.share { padding: 10px 0; border-bottom: 1px dashed var(--line); display: grid; gap: 6px; }
.share-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; }
.share-name { font-weight: 700; overflow-wrap: anywhere; }
.figures { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: .85rem; color: var(--muted); }
.figures .num { color: var(--ink); }
.figures .rest .num { font-weight: 600; }
.pill { font-size: .75rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.due { background: var(--due-soft); color: var(--due); }
.pill.part { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.history { list-style: none; margin: 0; padding: 0 0 0 12px; border-left: 2px solid var(--line); font-size: .83rem; color: var(--muted); display: grid; gap: 2px; }
.history li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.history .x { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: .8rem; text-decoration: underline; }
.share-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.repay-form { background: var(--paper); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
.repay-form .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.repay-form label { font-size: .8rem; color: var(--muted); }
.yen-input { display: flex; align-items: center; gap: 4px; }
.yen-input span { color: var(--muted); }
.yen-input input { width: 8.5em; text-align: right; font-family: var(--font-num); }
.entry-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .88rem; }
.confirm span { color: var(--due); font-weight: 700; }

.stamp {
  position: absolute; top: 12px; right: 14px; width: 58px; height: 58px; border-radius: 50%;
  border: 2.5px solid var(--shu); color: var(--shu); display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 900; font-size: 1rem; letter-spacing: .05em;
  transform: rotate(-14deg); opacity: .85; pointer-events: none;
  box-shadow: inset 0 0 0 2px var(--sheet), inset 0 0 0 3.5px var(--shu);
}
.stamp.open { border-style: dashed; box-shadow: none; opacity: .5; font-size: .78rem; color: var(--muted); border-color: var(--line); }

.howto { font-size: .83rem; color: var(--muted); display: grid; gap: 4px; padding: 0 4px; }
.howto p { margin: 0; max-width: 65ch; }

/* editor sheet */
.backdrop { position: fixed; inset: 0; background: rgba(10, 16, 20, .45); z-index: 20; display: grid; place-items: end center; overflow-y: auto; }
@media (min-width: 640px) { .backdrop { place-items: center; padding: 24px; } }
.sheet {
  background: var(--sheet); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px; box-shadow: var(--shadow); max-height: 100%; overflow-y: auto;
}
@media (min-width: 640px) { .sheet { border-radius: 16px; max-height: calc(100vh - 48px); } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-head h2 { font-family: var(--font-display); font-size: 1.3rem; }
.close { border: 0; background: none; font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--muted); padding: 4px 8px; }
.field { display: grid; gap: 4px; }
.field > label, fieldset legend { font-size: .82rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .two { grid-template-columns: 1fr; } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--sheet); padding: 7px 12px; cursor: pointer; font-size: .9rem; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ai-soft); font-weight: 700; }
.amount-rows { display: grid; gap: 8px; }
.amount-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.amount-row .name { min-width: 0; overflow-wrap: anywhere; }
.amount-row small { display: block; color: var(--muted); font-size: .75rem; }
.preview { background: var(--paper); border-radius: 10px; padding: 10px 12px; font-size: .9rem; }
.preview .num { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.err { color: var(--due); font-size: .88rem; margin: 0; font-weight: 500; }
.sheet-foot { display: flex; justify-content: flex-end; gap: 8px; }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: .9rem;
  z-index: 40; max-width: calc(100vw - 32px); box-shadow: var(--shadow);
}
.toast.bad { background: var(--due); color: #fff; }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .2s ease-out; }
  @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>きょうだい貸し借り帳</h1>
      <p>貸した人だけが、自分の記録を書いたり直したりできます</p>
    </div>
    <div class="me" id="me"></div>
  </header>
  <main id="app">
    <div class="notice"><h2>読み込み中…</h2><p>みんなの貸し借りを取りに行っています。</p></div>
  </main>
  <footer class="howto">
    <p><b>使い方</b>：お金を貸したら「＋ 貸した記録をつける」。返してもらったら、貸した人が「返済を記録」を押します。</p>
    <p>4人でごはんに行って1人が全部払ったときは「合計を割り勘」を選ぶと、ほかの人の分をまとめて記録できます。</p>
    <p>記録は全員が見られますが、書き込めるのは貸した本人だけです。オーナーも含め、ほかの人の記録は変えられません。</p>
  </footer>
</div>
<div id="editor"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
  "use strict";

  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const yen = (n) => "¥" + Math.round(n || 0).toLocaleString("ja-JP");
  const pad = (n) => String(n).padStart(2, "0");
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const fmtDate = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? `${m[1]}年${+m[2]}月${+m[3]}日` : ""; };
  const toInt = (s) => {
    const t = String(s ?? "").replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).replace(/[^\d]/g, "");
    return t ? Math.min(parseInt(t, 10), 1e10) : 0;
  };
  const num = (v) => (typeof v === "number" && Number.isFinite(v) && v >= 0 ? Math.round(v) : 0);
  const str = (v, max = 200) => (typeof v === "string" ? v.slice(0, max) : "");
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // ---------- state ----------
  const S = {
    db: null, user: null, me: null, meProfile: null,
    noRuntime: false, noDb: false, connecting: true, stale: false, fatal: "",
    members: new Map(),          // uid -> { nickname }
    loans: new Map(),            // lenderId -> [loan]
    loanSubs: new Map(),         // lenderId -> unsubscribe
    profiles: {},
    tab: "summary", filter: "all", showDone: false,
    nick: "", renaming: false,
    repay: null,                 // { loanId, to, amount, date }
    confirm: null,               // { kind: "loan"|"repay", loanId, to?, rid? }
    form: null,                  // editor state
    readOnly: false,
  };
  let writing = Promise.resolve();

  // ---------- data shaping (other people's data is untrusted) ----------
  function cleanLoan(id, v) {
    v = v && typeof v === "object" ? v : {};
    const shares = Array.isArray(v.shares) ? v.shares
      .filter((s) => s && typeof s === "object" && typeof s.to === "string" && s.to)
      .map((s) => ({
        to: s.to,
        amount: num(s.amount),
        repayments: Array.isArray(s.repayments) ? s.repayments
          .filter((r) => r && typeof r === "object")
          .map((r) => ({ id: str(r.id, 40) || rid(), date: str(r.date, 10), amount: num(r.amount) })) : [],
      })) : [];
    return {
      id, title: str(v.title, 60), date: str(v.date, 10), memo: str(v.memo, 300),
      mode: v.mode === "split" ? "split" : "each", total: num(v.total), includeSelf: !!v.includeSelf,
      shares, createdAt: str(v.createdAt, 40),
    };
  }
  const shareStat = (s) => {
    const paid = s.repayments.reduce((a, r) => a + r.amount, 0);
    return { paid, rest: Math.max(0, s.amount - paid) };
  };
  const loanTotal = (l) => l.shares.reduce((a, s) => a + s.amount, 0);
  const loanRest = (l) => l.shares.reduce((a, s) => a + shareStat(s).rest, 0);
  function allLoans() {
    const out = [];
    for (const [lender, arr] of S.loans) for (const l of arr) out.push({ ...l, lender });
    return out.sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || "").localeCompare(a.createdAt || ""));
  }
  // owed[a][b] = what b still has to give back to a
  function owedMatrix() {
    const m = {};
    for (const l of allLoans()) for (const s of l.shares) {
      if (s.to === l.lender) continue;
      const r = shareStat(s).rest;
      if (!r) continue;
      (m[l.lender] ||= {})[s.to] = (m[l.lender][s.to] || 0) + r;
    }
    return m;
  }
  const owed = (m, a, b) => (m[a] && m[a][b]) || 0;
  function people() {
    const set = new Set(S.members.keys());
    for (const [lender, arr] of S.loans) { set.add(lender); for (const l of arr) for (const s of l.shares) set.add(s.to); }
    return [...set];
  }
  const name = (id) => (S.members.get(id)?.nickname) || (S.profiles[id]?.name) || "だれか";
  const nameH = (id) => esc(name(id)) + (id === S.me ? "（あなた）" : "");
  const isMember = () => !!S.me && S.members.has(S.me);
  const canWrite = () => isMember() && !S.readOnly;
  const myLoan = (id) => (S.loans.get(S.me) || []).find((l) => l.id === id);

  // ---------- rendering ----------
  let renderToken = 0, renderQueued = false;
  function scheduleRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; render(); });
  }
  async function render() {
    const token = ++renderToken;
    const ids = people();
    if (S.me && !ids.includes(S.me)) ids.push(S.me);
    if (S.user && ids.length) {
      try { S.profiles = await S.user.profiles(ids); } catch (_) { /* reads never reject; keep going */ }
    }
    if (token !== renderToken) return;
    const focus = saveFocus();
    $("#me").innerHTML = viewMe();
    $("#app").innerHTML = viewApp();
    restoreFocus(focus);
  }
  function saveFocus() {
    const a = document.activeElement;
    if (!a || !a.id || !$("#app").contains(a)) return null;
    return { id: a.id, s: a.selectionStart, e: a.selectionEnd };
  }
  function restoreFocus(f) {
    if (!f) return;
    const el = document.getElementById(f.id);
    if (!el) return;
    el.focus();
    try { if (f.s != null) el.setSelectionRange(f.s, f.e); } catch (_) {}
  }

  function viewMe() {
    if (!S.me) return "";
    const p = S.profiles[S.me];
    const img = p?.avatarUrl ? `<img src="${esc(p.avatarUrl)}" alt="">` : "";
    if (!isMember()) return img;
    if (S.renaming) return "";
    return `${img}<span><b>${esc(name(S.me))}</b> として記録中</span>` +
      (canWrite() ? ` <button class="btn link" data-act="rename-open">呼び名を変える</button>` : "");
  }

  function viewApp() {
    if (S.noRuntime || S.noDb) {
      return `<div class="notice"><h2>claude.ai で開いてください</h2>
        <p>この貸し借り帳は、claude.ai にサインインした状態で開くと使えます。共有されたリンクから開き直してみてください。</p></div>`;
    }
    if (S.fatal) return `<div class="notice"><h2>データを読み込めませんでした</h2><p>${esc(S.fatal)}</p></div>`;
    let html = "";
    if (S.connecting) {
      html += S.stale
        ? `<div class="notice"><h2>まだデータにつながりません</h2><p>通信が不安定かもしれません。つながりしだい表示します。</p></div>`
        : `<div class="notice"><h2>読み込み中…</h2><p>みんなの貸し借りを取りに行っています。</p></div>`;
      return html;
    }
    if (S.stale) html += `<div class="notice"><p>通信が不安定なため、表示が最新でないかもしれません。</p></div>`;
    html += viewJoin();
    html += `<div class="bar">
      <div class="tabs" role="tablist">
        <button role="tab" data-act="tab" data-v="summary" aria-selected="${S.tab === "summary"}">まとめ</button>
        <button role="tab" data-act="tab" data-v="entries" aria-selected="${S.tab === "entries"}">記録</button>
      </div>
      ${canWrite() ? `<button class="btn primary" data-act="new">＋ 貸した記録をつける</button>` : ""}
    </div>`;
    html += S.tab === "summary" ? viewSummary() : viewEntries();
    return html;
  }

  function viewJoin() {
    if (!S.me) {
      return `<div class="notice"><h2>見るだけモード</h2><p>サインインしていないため、記録をつけることはできません。</p></div>`;
    }
    if (S.readOnly) {
      return `<div class="notice"><h2>見るだけモード</h2><p>このページへの書き込み権限がありません。記録をつけたいときは、オーナーに「編集者」として共有し直してもらってください。</p></div>`;
    }
    if (isMember() && !S.renaming) return "";
    const renaming = isMember();
    return `<form class="notice join" data-form="${renaming ? "rename" : "join"}">
      <h2>${renaming ? "呼び名を変える" : "この貸し借り帳に参加する"}</h2>
      <p>${renaming ? "ほかの人の画面にもこの名前で表示されます。" : "みんなに表示される呼び名を決めてください（例：兄、ゆうき）。参加すると、貸した記録をつけられるようになり、ほかの人もあなたを貸し相手として選べます。"}</p>
      <div class="inline-form">
        <input type="text" id="nick" data-bind="nick" maxlength="20" placeholder="呼び名" value="${esc(S.nick)}" aria-label="呼び名">
        <button class="btn primary" type="submit">${renaming ? "変更する" : "参加する"}</button>
        ${renaming ? `<button class="btn" type="button" data-act="rename-cancel">やめる</button>` : ""}
      </div>
    </form>`;
  }

  function viewSummary() {
    const m = owedMatrix();
    const ids = people();
    let html = "";
    if (isMember()) {
      const others = ids.filter((id) => id !== S.me);
      const inSum = others.reduce((a, id) => a + owed(m, S.me, id), 0);
      const outSum = others.reduce((a, id) => a + owed(m, id, S.me), 0);
      const rows = others.map((id) => {
        const a = owed(m, S.me, id), b = owed(m, id, S.me), net = a - b;
        const detail = a && b ? `<small>貸し <span class="num">${yen(a)}</span>・借り <span class="num">${yen(b)}</span> を差し引き</small>` : "";
        if (net > 0) return `<li><div class="who">${nameH(id)} <span class="arrow">→</span> あなた${detail}</div><div class="amt in num">${yen(net)}</div></li>`;
        if (net < 0) return `<li><div class="who">あなた <span class="arrow">→</span> ${nameH(id)}${detail}</div><div class="amt out num">${yen(-net)}</div></li>`;
        return `<li><div class="who">${nameH(id)}${detail}</div><div class="amt zero">貸し借りなし</div></li>`;
      }).join("");
      html += `<section class="ledger" aria-label="あなたの貸し借り">
        <div class="ledger-head">
          <div class="balance in"><span class="label">返ってくる予定</span><span class="num">${yen(inSum)}</span><span class="hint">あなたが貸していて、まだ返ってきていない分</span></div>
          <div class="balance out"><span class="label">返す予定</span><span class="num">${yen(outSum)}</span><span class="hint">あなたが借りていて、まだ返していない分</span></div>
        </div>
        <div class="section-title">相手ごと（差し引き後）</div>
        ${others.length ? `<ul class="rows">${rows}</ul>` : `<p class="empty">まだほかの人が参加していません。このページを共有して、参加してもらいましょう。</p>`}
      </section>`;
    }
    // everyone, pairwise net
    const pairs = [];
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const a = ids[i], b = ids[j], net = owed(m, a, b) - owed(m, b, a);
      if (net > 0) pairs.push({ from: b, to: a, amt: net });
      else if (net < 0) pairs.push({ from: a, to: b, amt: -net });
    }
    pairs.sort((x, y) => y.amt - x.amt);
    const total = pairs.reduce((a, p) => a + p.amt, 0);
    html += `<section class="ledger" aria-label="みんなの貸し借り">
      <div class="section-title">みんなの状況（だれがだれに返す？）</div>
      ${pairs.length ? `<ul class="rows">${pairs.map((p) => `<li><div class="who">${nameH(p.from)} <span class="arrow">→</span> ${nameH(p.to)}</div><div class="amt num">${yen(p.amt)}</div></li>`).join("")}
        <li><div class="who"><small>まだ返っていないお金の合計</small></div><div class="amt num">${yen(total)}</div></li></ul>`
        : `<p class="empty">いま返していないお金はありません。${canWrite() ? "お金を貸したら「＋ 貸した記録をつける」から記録しましょう。" : ""}</p>`}
    </section>`;
    return html;
  }

  function viewEntries() {
    const f = S.filter;
    let list = allLoans();
    if (f === "lent") list = list.filter((l) => l.lender === S.me);
    if (f === "borrowed") list = list.filter((l) => l.shares.some((s) => s.to === S.me));
    const doneCount = list.filter((l) => l.shares.length && loanRest(l) === 0).length;
    if (!S.showDone) list = list.filter((l) => !l.shares.length || loanRest(l) > 0);
    const chip = (v, label) => `<button class="chip" data-act="filter" data-v="${v}" aria-pressed="${f === v}">${label}</button>`;
    let html = `<div class="filters">
      ${chip("all", "ぜんぶ")}${S.me ? chip("lent", "自分が貸した") + chip("borrowed", "自分が借りた") : ""}
      <label class="check"><input type="checkbox" id="show-done" ${S.showDone ? "checked" : ""}> 返済済みも表示${doneCount ? `（${doneCount}件）` : ""}</label>
    </div>`;
    if (!list.length) {
      html += `<div class="notice"><p>${S.showDone || !doneCount ? "該当する記録はまだありません。" : "返していない記録はありません。返済済みの記録は上のチェックで表示できます。"}</p></div>`;
      return html;
    }
    html += `<div class="entries">${list.map(viewEntry).join("")}</div>`;
    return html;
  }

  function viewEntry(l) {
    const mine = l.lender === S.me && canWrite();
    const total = loanTotal(l), rest = loanRest(l);
    const done = l.shares.length > 0 && rest === 0;
    const split = l.mode === "split" && l.total
      ? `<span>${l.shares.length + (l.includeSelf ? 1 : 0)}人で割り勘（合計 <span class="num">${yen(l.total)}</span>）</span>` : "";
    const shares = l.shares.map((s) => {
      const { paid, rest: r } = shareStat(s);
      const pill = r === 0 ? `<span class="pill ok">完済</span>` : paid > 0 ? `<span class="pill part">一部返済</span>` : `<span class="pill due">未返済</span>`;
      const hist = s.repayments.length ? `<ul class="history">${s.repayments.map((rp) => {
        const confirming = S.confirm?.kind === "repay" && S.confirm.loanId === l.id && S.confirm.to === s.to && S.confirm.rid === rp.id;
        return `<li><span>${esc(fmtDate(rp.date))}</span><span class="num">${yen(rp.amount)}</span> 返済
          ${mine ? (confirming
            ? `<span class="confirm"><span>この返済を取り消す？</span><button class="btn small danger" data-act="del-repay-yes">取り消す</button><button class="btn small" data-act="confirm-cancel">やめる</button></span>`
            : `<button class="x" data-act="del-repay" data-id="${esc(l.id)}" data-to="${esc(s.to)}" data-rid="${esc(rp.id)}">取り消す</button>`) : ""}</li>`;
      }).join("")}</ul>` : "";
      const open = S.repay && S.repay.loanId === l.id && S.repay.to === s.to;
      const repay = mine && r > 0 ? (open ? `<form class="repay-form" data-form="repay">
          <div class="row">
            <div class="field"><label for="rp-amount">返してもらった金額</label>
              <div class="yen-input"><span>¥</span><input type="text" inputmode="numeric" id="rp-amount" data-bind="repayAmount" value="${esc(S.repay.amount)}"></div></div>
            <div class="field"><label for="rp-date">日付</label><input type="date" id="rp-date" data-bind="repayDate" value="${esc(S.repay.date)}"></div>
          </div>
          <div class="row">
            <button class="btn small" type="button" data-act="repay-full">残り全額（${yen(r)}）</button>
            <span style="flex:1"></span>
            <button class="btn small" type="button" data-act="repay-cancel">やめる</button>
            <button class="btn small primary" type="submit">記録する</button>
          </div>
        </form>` : `<div class="share-actions"><button class="btn small" data-act="repay-open" data-id="${esc(l.id)}" data-to="${esc(s.to)}">返済を記録</button></div>`) : "";
      return `<li class="share">
        <div class="share-main">
          <div><span class="share-name">${nameH(s.to)}</span>
            <div class="figures"><span>貸した <span class="num">${yen(s.amount)}</span></span><span>返済 <span class="num">${yen(paid)}</span></span><span class="rest">残り <span class="num">${yen(r)}</span></span></div>
          </div>${pill}
        </div>${hist}${repay}
      </li>`;
    }).join("");
    const confirmingLoan = S.confirm?.kind === "loan" && S.confirm.loanId === l.id;
    const actions = mine ? `<div class="entry-actions">${confirmingLoan
      ? `<span class="confirm"><span>この記録を削除しますか？返済の履歴も消えます。</span><button class="btn small danger" data-act="del-loan-yes">削除する</button><button class="btn small" data-act="confirm-cancel">やめる</button></span>`
      : `<button class="btn small" data-act="edit" data-id="${esc(l.id)}">直す</button><button class="btn small danger" data-act="del-loan" data-id="${esc(l.id)}">削除</button>`}</div>` : "";
    return `<article class="entry${done ? " done" : ""}">
      ${done ? `<div class="stamp" aria-label="完済">完済</div>` : ""}
      <div class="entry-head"><h3>${esc(l.title || "（内容なし）")}</h3><time>${esc(fmtDate(l.date))}</time></div>
      <div class="meta"><span>貸した人 <b>${nameH(l.lender)}</b></span><span>貸した合計 <b class="num">${yen(total)}</b></span>${rest ? `<span>残り <b class="num">${yen(rest)}</b></span>` : ""}${split}</div>
      ${l.memo ? `<p class="memo">${esc(l.memo)}</p>` : ""}
      <ul class="shares">${shares || `<li class="share"><span class="memo">相手がいません</span></li>`}</ul>
      ${actions}
    </article>`;
  }

  // ---------- editor ----------
  function openEditor(loanId) {
    const l = loanId ? myLoan(loanId) : null;
    const f = {
      id: l ? l.id : null, date: l ? l.date || today() : today(), title: l ? l.title : "", memo: l ? l.memo : "",
      mode: l ? l.mode : "each", total: l && l.total ? String(l.total) : "", includeSelf: l ? l.includeSelf : true,
      selected: l ? l.shares.map((s) => s.to) : [], amounts: {}, paid: {}, err: "", saving: false,
    };
    if (l) for (const s of l.shares) { f.amounts[s.to] = String(s.amount); f.paid[s.to] = shareStat(s).paid; }
    S.form = f;
    renderEditor();
    setTimeout(() => $("#f-title")?.focus(), 0);
  }
  function closeEditor() { S.form = null; renderEditor(); }
  function candidates() {
    const ids = [...S.members.keys()].filter((id) => id !== S.me);
    for (const id of S.form?.selected || []) if (!ids.includes(id) && id !== S.me) ids.push(id);
    return ids;
  }
  function splitCalc(f) {
    const total = toInt(f.total);
    const n = f.selected.length + (f.includeSelf ? 1 : 0);
    if (!total || !f.selected.length || !n) return null;
    const per = Math.floor(total / n);
    return { total, n, per, rem: total - per * n };
  }
  function renderEditor() {
    document.body.classList.toggle("locked", !!S.form);
    const box = $("#editor");
    const f = S.form;
    if (!f) { box.innerHTML = ""; return; }
    const cands = candidates();
    const chips = cands.length ? cands.map((id) => {
      const on = f.selected.includes(id);
      const locked = on && f.paid[id] > 0;
      return `<button type="button" class="chip" data-act="ed-toggle" data-to="${esc(id)}" aria-pressed="${on}" ${locked ? `disabled title="返済の記録があるので外せません"` : ""}>${esc(name(id))}</button>`;
    }).join("") : `<p class="err" style="color:var(--muted)">まだほかの人が参加していません。このページを共有して「参加する」を押してもらうと、ここに表示されます。</p>`;
    const amountRows = f.mode === "each" ? (f.selected.length ? `<div class="amount-rows">${f.selected.map((id) => `
      <div class="amount-row"><label class="name" for="amt-${esc(id)}">${esc(name(id))}${f.paid[id] ? `<small>返済済み ${yen(f.paid[id])}</small>` : ""}</label>
      <div class="yen-input"><span>¥</span><input type="text" inputmode="numeric" id="amt-${esc(id)}" data-bind="form.amount" data-key="${esc(id)}" value="${esc(f.amounts[id] || "")}" placeholder="0"></div></div>`).join("")}</div>`
      : `<p class="err" style="color:var(--muted)">上で貸した相手を選んでください。</p>`)
      : `<div class="two">
          <div class="field"><label for="f-total">払った合計</label><div class="yen-input"><span>¥</span><input type="text" inputmode="numeric" id="f-total" data-bind="form.total" value="${esc(f.total)}" placeholder="12000"></div></div>
          <label class="check" style="align-self:end"><input type="checkbox" id="f-self" data-bind="form.includeSelf" ${f.includeSelf ? "checked" : ""}> 自分の分も含めて割る</label>
        </div>`;
    box.innerHTML = `<div class="backdrop" data-act="ed-backdrop">
      <form class="sheet" role="dialog" aria-modal="true" aria-labelledby="ed-title" data-form="editor">
        <div class="sheet-head"><h2 id="ed-title">${f.id ? "記録を直す" : "貸した記録をつける"}</h2><button type="button" class="close" data-act="ed-close" aria-label="閉じる">×</button></div>
        <div class="two">
          <div class="field"><label for="f-title">なにに貸した？</label><input type="text" id="f-title" data-bind="form.title" maxlength="60" placeholder="例：焼肉代、立て替えた電車代" value="${esc(f.title)}"></div>
          <div class="field"><label for="f-date">貸した日</label><input type="date" id="f-date" data-bind="form.date" value="${esc(f.date)}"></div>
        </div>
        <fieldset><legend>だれに貸した？（複数選べます）</legend><div class="chips">${chips}</div></fieldset>
        <fieldset><legend>金額の決め方</legend>
          <div><div class="seg">
            <button type="button" data-act="ed-mode" data-v="each" aria-pressed="${f.mode === "each"}">人ごとに金額を入れる</button>
            <button type="button" data-act="ed-mode" data-v="split" aria-pressed="${f.mode === "split"}">合計を割り勘</button>
          </div></div>
          ${amountRows}
          <div class="preview" id="ed-preview"></div>
        </fieldset>
        <div class="field"><label for="f-memo">メモ（なくてもOK）</label><textarea id="f-memo" data-bind="form.memo" maxlength="300" placeholder="例：給料日に返すって">${esc(f.memo)}</textarea></div>
        <p class="err" id="ed-err" ${f.err ? "" : "hidden"}>${esc(f.err)}</p>
        <div class="sheet-foot"><button type="button" class="btn" data-act="ed-close">やめる</button><button type="submit" class="btn primary" ${f.saving ? "disabled" : ""}>${f.saving ? "保存中…" : "保存する"}</button></div>
      </form></div>`;
    updatePreview();
  }
  function updatePreview() {
    const f = S.form, el = $("#ed-preview");
    if (!f || !el) return;
    if (f.mode === "split") {
      const c = splitCalc(f);
      if (!c) { el.innerHTML = "相手を選んで合計を入れると、1人あたりの金額が出ます。"; return; }
      el.innerHTML = `${c.n}人で割って、1人あたり <span class="num">${yen(c.per)}</span>。` +
        `${f.selected.map((id) => esc(name(id))).join("・")} にそれぞれ <span class="num">${yen(c.per)}</span> を貸した記録になります。` +
        (c.rem ? `<br>割り切れない <span class="num">${yen(c.rem)}</span> はあなたの負担になります。` : "");
    } else {
      const sum = f.selected.reduce((a, id) => a + toInt(f.amounts[id]), 0);
      el.innerHTML = f.selected.length ? `貸した合計 <span class="num">${yen(sum)}</span>` : "相手を選ぶと、ここに合計が出ます。";
    }
  }
  function showEdErr(msg) {
    if (!S.form) return;
    S.form.err = msg;
    const el = $("#ed-err");
    if (el) { el.textContent = msg; el.hidden = !msg; }
  }
  async function saveEditor() {
    const f = S.form;
    if (!f || f.saving) return;
    const title = f.title.trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(f.date)) return showEdErr("貸した日を入れてください。");
    if (!f.selected.length) return showEdErr("貸した相手を1人以上選んでください。");
    let amounts = {};
    if (f.mode === "split") {
      const c = splitCalc(f);
      if (!c) return showEdErr("払った合計を入れてください。");
      if (c.per <= 0) return showEdErr("1人あたりの金額が0円になってしまいます。合計を見直してください。");
      for (const id of f.selected) amounts[id] = c.per;
    } else {
      for (const id of f.selected) {
        const v = toInt(f.amounts[id]);
        if (v <= 0) return showEdErr(`${name(id)} に貸した金額を入れてください。`);
        amounts[id] = v;
      }
    }
    for (const id of f.selected) if (f.paid[id] > amounts[id]) {
      return showEdErr(`${name(id)} はもう ${yen(f.paid[id])} 返しているので、それより少ない金額にはできません。`);
    }
    const prev = f.id ? myLoan(f.id) : null;
    const shares = f.selected.map((id) => ({
      to: id, amount: amounts[id],
      repayments: prev ? (prev.shares.find((s) => s.to === id)?.repayments || []).map((r) => ({ ...r })) : [],
    }));
    const now = new Date().toISOString();
    const body = {
      title, date: f.date, memo: f.memo.trim(), mode: f.mode,
      total: f.mode === "split" ? toInt(f.total) : 0, includeSelf: f.mode === "split" ? !!f.includeSelf : false,
      shares, createdAt: prev?.createdAt || now, updatedAt: now,
    };
    f.saving = true; showEdErr(""); renderEditor();
    const col = S.db.collection(`ledger/${S.me}/loans`);
    const ref = f.id ? col.doc(f.id) : col.doc();
    const ok = await write(() => ref.set(body), f.id ? "記録を直しました" : "記録しました");
    if (!S.form) return;
    if (ok) { closeEditor(); if (!f.id) { S.tab = "entries"; scheduleRender(); } }
    else { S.form.saving = false; renderEditor(); }
  }

  // ---------- writes ----------
  function errText(e) {
    const c = e && e.code;
    if (c === "invalid_argument") return "保存する権限がありません。オーナーにこのページを「編集者」として共有してもらってください。";
    if (c === "quota_exceeded") return "保存できる量の上限です。返済済みの古い記録を削除してから試してください。";
    if (c === "resource_exhausted") return "操作が多すぎます。少し待ってからもう一度試してください。";
    return "保存できませんでした。通信を確認して、もう一度試してください。";
  }
  function write(fn, okMsg) {
    const run = async () => {
      try { await fn(); }
      catch (e) {
        if (e && e.code === "unavailable") { await sleep(400 + Math.random() * 800); await fn(); }
        else throw e;
      }
    };
    const p = writing.then(run);
    writing = p.catch(() => {});
    return p.then(() => { if (okMsg) toast(okMsg); return true; }, (e) => {
      if (e && e.code === "invalid_argument") S.readOnly = true;
      toast(errText(e), true); scheduleRender(); return false;
    });
  }

  async function joinOrRename() {
    const nick = S.nick.trim().slice(0, 20);
    if (!nick) { toast("呼び名を入れてください", true); return; }
    const ref = S.db.doc(`ledger/${S.me}`);
    const renaming = isMember();
    const ok = await write(() => renaming ? ref.update({ nickname: nick }) : ref.set({ nickname: nick, joinedAt: new Date().toISOString() }),
      renaming ? "呼び名を変えました" : "参加しました");
    if (ok) {
      if (!renaming) S.members.set(S.me, { nickname: nick });
      S.renaming = false; S.nick = "";
      scheduleRender();
    }
  }

  async function saveRepay() {
    const r = S.repay;
    if (!r) return;
    const l = myLoan(r.loanId);
    if (!l) { S.repay = null; scheduleRender(); return; }
    const amt = toInt(r.amount);
    const share = l.shares.find((s) => s.to === r.to);
    if (!share) return;
    const rest = shareStat(share).rest;
    if (amt <= 0) { toast("返してもらった金額を入れてください", true); return; }
    if (amt > rest) { toast(`残りは ${yen(rest)} です。それ以下の金額にしてください`, true); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(r.date)) { toast("日付を入れてください", true); return; }
    const shares = l.shares.map((s) => ({
      to: s.to, amount: s.amount,
      repayments: s.to === r.to ? [...s.repayments, { id: rid(), date: r.date, amount: amt }] : s.repayments.map((x) => ({ ...x })),
    }));
    const done = rest - amt === 0;
    S.repay = null; scheduleRender();
    await write(() => S.db.doc(`ledger/${S.me}/loans/${l.id}`).update({ shares, updatedAt: new Date().toISOString() }),
      done ? `${name(r.to)} の分が完済になりました` : "返済を記録しました");
  }
  async function deleteRepay() {
    const c = S.confirm; S.confirm = null;
    const l = c && myLoan(c.loanId);
    if (!l) { scheduleRender(); return; }
    const shares = l.shares.map((s) => ({
      to: s.to, amount: s.amount,
      repayments: s.repayments.filter((x) => !(s.to === c.to && x.id === c.rid)).map((x) => ({ ...x })),
    }));
    scheduleRender();
    await write(() => S.db.doc(`ledger/${S.me}/loans/${l.id}`).update({ shares, updatedAt: new Date().toISOString() }), "返済の記録を取り消しました");
  }
  async function deleteLoan() {
    const c = S.confirm; S.confirm = null;
    if (!c || !myLoan(c.loanId)) { scheduleRender(); return; }
    scheduleRender();
    await write(() => S.db.doc(`ledger/${S.me}/loans/${c.loanId}`).delete(), "記録を削除しました");
  }

  // ---------- toast ----------
  let toastTimer = 0;
  function toast(msg, bad) {
    const t = $("#toast");
    t.textContent = msg; t.classList.toggle("bad", !!bad); t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, bad ? 5000 : 2600);
  }

  // ---------- events ----------
  function onBind(e) {
    const t = e.target, b = t.dataset && t.dataset.bind;
    if (!b) return;
    if (b === "nick") S.nick = t.value;
    else if (b === "repayAmount" && S.repay) S.repay.amount = t.value;
    else if (b === "repayDate" && S.repay) S.repay.date = t.value;
    else if (b.startsWith("form.") && S.form) {
      const k = b.slice(5);
      if (k === "amount") S.form.amounts[t.dataset.key] = t.value;
      else if (k === "includeSelf") S.form.includeSelf = t.checked;
      else S.form[k] = t.value;
      updatePreview();
    }
  }
  document.addEventListener("input", onBind);
  document.addEventListener("change", (e) => {
    onBind(e);
    if (e.target.id === "show-done") { S.showDone = e.target.checked; scheduleRender(); }
  });
  document.addEventListener("submit", (e) => {
    e.preventDefault();
    const k = e.target.dataset.form;
    if (k === "join" || k === "rename") joinOrRename();
    else if (k === "repay") saveRepay();
    else if (k === "editor") saveEditor();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.form) closeEditor(); });
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act, d = el.dataset;
    if (act === "ed-backdrop") { if (e.target === el) closeEditor(); return; }
    switch (act) {
      case "tab": S.tab = d.v; S.confirm = null; break;
      case "filter": S.filter = d.v; break;
      case "new": openEditor(null); return;
      case "edit": S.confirm = null; openEditor(d.id); return;
      case "del-loan": S.confirm = { kind: "loan", loanId: d.id }; break;
      case "del-loan-yes": deleteLoan(); return;
      case "del-repay": S.confirm = { kind: "repay", loanId: d.id, to: d.to, rid: d.rid }; break;
      case "del-repay-yes": deleteRepay(); return;
      case "confirm-cancel": S.confirm = null; break;
      case "repay-open": {
        const l = myLoan(d.id), s = l && l.shares.find((x) => x.to === d.to);
        S.repay = { loanId: d.id, to: d.to, amount: s ? String(shareStat(s).rest) : "", date: today() };
        S.confirm = null;
        scheduleRender();
        setTimeout(() => { const i = $("#rp-amount"); if (i) { i.focus(); i.select(); } }, 30);
        return;
      }
      case "repay-full": {
        const l = S.repay && myLoan(S.repay.loanId), s = l && l.shares.find((x) => x.to === S.repay.to);
        if (s) { S.repay.amount = String(shareStat(s).rest); const i = $("#rp-amount"); if (i) i.value = S.repay.amount; }
        return;
      }
      case "repay-cancel": S.repay = null; break;
      case "rename-open": S.renaming = true; S.nick = S.members.get(S.me)?.nickname || ""; break;
      case "rename-cancel": S.renaming = false; S.nick = ""; break;
      case "ed-close": closeEditor(); return;
      case "ed-mode": if (S.form) { S.form.mode = d.v; S.form.err = ""; renderEditor(); } return;
      case "ed-toggle": if (S.form) {
        const i = S.form.selected.indexOf(d.to);
        if (i >= 0) { if (S.form.paid[d.to] > 0) return; S.form.selected.splice(i, 1); }
        else S.form.selected.push(d.to);
        S.form.err = ""; renderEditor();
      } return;
      default: return;
    }
    scheduleRender();
  });

  // ---------- subscriptions ----------
  function syncLoanSubs() {
    for (const id of S.members.keys()) {
      if (S.loanSubs.has(id)) continue;
      const unsub = S.db.collection(`ledger/${id}/loans`).onSnapshot((snap) => {
        S.loans.set(id, snap.docs.filter((d) => d.exists).map((d) => cleanLoan(d.id, d.data())));
        // drop UI pointers to documents that vanished
        if (id === S.me) {
          if (S.repay && !myLoan(S.repay.loanId)) S.repay = null;
          if (S.confirm && !myLoan(S.confirm.loanId)) S.confirm = null;
        }
        scheduleRender();
      }, () => { /* this person's records can't be read right now; keep the rest */ });
      S.loanSubs.set(id, unsub);
    }
    for (const [id, unsub] of S.loanSubs) if (!S.members.has(id)) { unsub(); S.loanSubs.delete(id); S.loans.delete(id); }
  }

  async function start() {
    const c = window.claude;
    if (!c || typeof c.use !== "function") { S.noRuntime = true; render(); return; }
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    S.db = db; S.user = user;
    if (!db) { S.noDb = true; render(); return; }
    S.me = user ? await user.id() : null;
    const timer = setTimeout(() => { S.stale = true; scheduleRender(); }, 10000);
    db.collection("ledger").onSnapshot((snap) => {
      if (!snap.metadata.fromCache) { clearTimeout(timer); S.stale = false; }
      S.connecting = false;
      const seen = new Set();
      for (const d of snap.docs) {
        if (!d.exists) continue;
        const v = d.data() || {};
        S.members.set(d.id, { nickname: str(v.nickname, 20) });
        seen.add(d.id);
      }
      for (const id of [...S.members.keys()]) if (!seen.has(id)) S.members.delete(id);
      syncLoanSubs();
      scheduleRender();
    }, (e) => {
      clearTimeout(timer);
      S.connecting = false;
      S.fatal = e && e.code === "revoked" ? "このページを開く権限がなくなりました。" : "時間をおいて、ページを開き直してください。";
      scheduleRender();
    });
    render();
  }
  start();
})();
</script>
